title: 'Força bruta de SSH no Linux'
id: '686b269e-009b-5ee3-a88e-9797bc59370e'
status: 'stable'
description: 'Oito ou mais falhas de senha no SSH, do mesmo endereço, em 2 minutos.'
references:
    - 'https://attack.mitre.org/techniques/T1110/001/'
author: 'RuleForge (regras de exemplo)'
date: '2026/10/23'
