title: 'Remoção das cópias de sombra (backups do Windows)'
id: '93621713-c2a6-5177-84e3-8aeb29cc020d'
status: 'stable'
description: 'Ransomware apaga as cópias de sombra para impedir a recuperação dos arquivos.'
references:
    - 'https://attack.mitre.org/techniques/T1490/'
author: 'RuleForge (regras de exemplo)'
date: '2026/10/23'
tags:
    - 'attack.impact'
    - 'attack.t1490'
logsource:
    category: 'process_creation'
    product: 'windows'
detection:
    selection_vss:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|all:
            - 'shadowcopy'
            - 'delete'
    condition: '1 of selection_*'
falsepositives:
    - 'Rotinas de limpeza de armazenamento (devem ser conhecidas)'
level: 'critical'
x_tests:
    positive:
        - {Image: 'C:\Windows\System32\vssadmin.exe', CommandLine: 'vssadmin.exe delete shadows /all /quiet'}
        - {Image: 'C:\Windows\System32\wbem\WMIC.exe', CommandLine: 'wmic shadowcopy delete'}
    negative:
        - {Image: 'C:\Windows\System32\vssadmin.exe', CommandLine: 'vssadmin.exe list shadows'}
