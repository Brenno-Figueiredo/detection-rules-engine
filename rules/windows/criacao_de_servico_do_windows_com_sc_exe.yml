title: 'Criação de serviço do Windows com sc.exe'
id: '38be0ac6-62e3-5fed-ba40-e55d6d0fe52e'
status: 'stable'
description: 'Criar um serviço aponta um programa para iniciar com o sistema: persistência e, muitas vezes, elevação de privilégio.'
references:
    - 'https://attack.mitre.org/techniques/T1543/003/'
author: 'RuleForge (regras de exemplo)'
date: '2026/10/23'
tags:
    - 'attack.persistence'
    - 'attack.t1543.003'
logsource:
    category: 'process_creation'
    product: 'windows'
detection:
    selection:
        Image|endswith: '\sc.exe'
        CommandLine|contains|all:
            - ' create '
            - 'binpath='
    condition: 'selection'
falsepositives:
    - 'Instaladores de software'
level: 'medium'
x_tests:
    positive:
        - {Image: 'C:\Windows\System32\sc.exe', CommandLine: 'sc.exe create Atualizador binPath= C:\temp\svc.exe start= auto'}
    negative:
        - {Image: 'C:\Windows\System32\sc.exe', CommandLine: 'sc.exe query spooler'}
