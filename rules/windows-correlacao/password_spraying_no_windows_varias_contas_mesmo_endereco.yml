title: 'Password spraying no Windows: várias contas, mesmo endereço'
id: '36be6f7c-5a8a-53b9-97cf-6481ee65fc75'
status: 'stable'
description: 'Oito ou mais contas diferentes com falha de logon, do mesmo endereço, em 10 minutos: uma senha comum tentada em muitas contas.'
references:
    - 'https://attack.mitre.org/techniques/T1110/003/'
author: 'RuleForge (regras de exemplo)'
date: '2026/10/23'
tags:
    - 'attack.credential_access'
    - 'attack.t1110.003'
correlation:
    type: 'value_count'
    rules:
        - 'win_failed_logon'
    group-by:
        - 'IpAddress'
    timespan: '10m'
    condition:
        gte: 8
        field: 'TargetUserName'
falsepositives:
    - 'Testes de segurança autorizados'
level: 'high'
